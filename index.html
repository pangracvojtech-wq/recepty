<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Receptář</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📖 Můj Receptář</h1>
        <button id="open-modal-btn">+ Přidat recept</button>
    </header>

    <main>
        <!-- Vyhledávání a filtry -->
        <section class="search-bar">
            <input type="text" id="search-input" placeholder="Hledat recept nebo ingredienci...">
        </section>

        <!-- Seznam receptů -->
        <section id="recipe-list" class="recipe-grid">
            <!-- Sem JS vykreslí recepty -->
        </section>
    </main>

    <!-- Formulář pro nový recept (Modal) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2>Nová ingredience / Recept</h2>
            <form id="recipe-form">
                <input type="text" id="title" placeholder="Název receptu" required>
                <textarea id="ingredients" placeholder="Ingredience (každá na nový řádek)" rows="4" required></textarea>
                <textarea id="instructions" placeholder="Postup přípravy" rows="5" required></textarea>
                
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">Uložit recept</button>
                    <button type="button" id="close-modal-btn" class="btn-secondary">Zrušit</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
